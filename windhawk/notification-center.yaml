# Moon - Windows 11 Notification Center Styler
# Windhawk > Windows 11 Notification Center Styler > Einstellungen > "Textual mode"
# Gesamten Inhalt einfuegen und "Save settings" klicken.
# Deckt ab: Benachrichtigungen, Kalender, Schnelleinstellungen (WLAN/Ton/...),
# Medien-Steuerung, Toasts und Sprunglisten (Rechtsklick auf Taskleisten-Apps).
styleConstants:
  - MoonBg=<WindhawkBlur BlurAmount="30" TintColor="#E6130F28" FallbackColor="#FF130F28"/>
  - MoonFlyout=<WindhawkBlur BlurAmount="30" TintColor="#F21A1535" FallbackColor="#FF1A1535"/>
  - MoonBorder=<SolidColorBrush Color="#598E7CFF"/>
  - Transparent=<SolidColorBrush Color="Transparent"/>
  - Radius=12
controlStyles:
  - target: Grid#NotificationCenterGrid
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: Grid#CalendarCenterGrid
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: ScrollViewer#CalendarControlScrollViewer
    styles:
      - Background:=$Transparent
      - BorderThickness=0
  - target: Border#CalendarHeaderMinimizedOverlay
    styles:
      - Background:=$Transparent
      - BorderThickness=0
  - target: ActionCenter.FocusSessionControl#FocusSessionControl > Grid#FocusGrid
    styles:
      - Background:=$Transparent
      - BorderThickness=0
  - target: Grid#ControlCenterRegion
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: Grid#L1Grid > Border
    styles:
      - Background:=$Transparent
  - target: Grid#FooterGrid
    styles:
      - Background:=$Transparent
      - BorderThickness=0
  - target: Grid#MediaTransportControlsRegion
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: Grid#MediaTransportControlsRoot
    styles:
      - Background:=$Transparent
  - target: ContentPresenter#PageContent, ContentPresenter#PageContent > Grid > Border
    styles:
      - Background:=$Transparent
  - target: QuickActions.ControlCenter.AccessibleWindow#PageWindow > ContentPresenter > Grid#FullScreenPageRoot
    styles:
      - Background:=$Transparent
  - target: ScrollViewer#ListContent
    styles:
      - Background:=$Transparent
  - target: ActionCenter.FlexibleToastView#FlexibleNormalToastView
    styles:
      - Background:=$Transparent
  - target: Border#ToastBackgroundBorder, Border#ToastBackgroundBorder2
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: ActionCenter.FlexibleItemView
    styles:
      - CornerRadius=$Radius
  - target: Border#JumpListRestyledAcrylic
    styles:
      - Background:=$MoonBg
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: MenuFlyoutPresenter > Border
    styles:
      - Background:=$MoonFlyout
      - BorderBrush:=$MoonBorder
      - BorderThickness=1
      - CornerRadius=8
themeResourceVariables:
  - CardBackgroundFillColorDefaultBrush:=<SolidColorBrush Color="#14B8ABFF"/>
  - CardStrokeColorDefaultBrush:=<SolidColorBrush Color="#2E8E7CFF"/>
  - ControlFillColorDefaultBrush:=<SolidColorBrush Color="#1AB8ABFF"/>
  - ControlFillColorSecondaryBrush:=<SolidColorBrush Color="#24B8ABFF"/>
  - ControlFillColorTertiaryBrush:=<SolidColorBrush Color="#0FB8ABFF"/>
  - ControlStrokeColorDefaultBrush:=<SolidColorBrush Color="#268E7CFF"/>
  - SubtleFillColorSecondaryBrush:=<SolidColorBrush Color="#1FB8ABFF"/>
  - SubtleFillColorTertiaryBrush:=<SolidColorBrush Color="#14B8ABFF"/>
  - DividerStrokeColorDefaultBrush:=<SolidColorBrush Color="#298E7CFF"/>
  - TextFillColorSecondaryBrush:=<SolidColorBrush Color="#D0C8F5"/>
